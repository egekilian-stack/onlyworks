 body{font-size:16px}.wrap{padding:max(26px,calc(env(safe-area-inset-top,0px) + 14px)) 12px 100px}.top{padding:8px 12px}

/* Datumsfelder sauber */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g2>.lb{min-width:0}

.chips{display:flex;flex-wrap:wrap;gap:8px}

label.chip.on,label.chip:has(input:checked){border-color:var(--pri);background:var(--gbg);color:var(--pri);font-weight:700}
label.chip:has(input:focus-visible){outline:2px solid var(--pri);outline-offset:2px}
/* ===== Design 2: hell, rund, farbige Statuspunkte ===== */
:root{--r:28px;--rs:18px;--fill:color-mix(in srgb,var(--ink) 6%,var(--card));--fnt:"SF Pro Display","SF Pro Text",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
html{background:var(--bg)}
body{font-family:var(--fnt);font-weight:500;letter-spacing:-.011em;line-height:1.38}
h1{font-size:34px;font-weight:800;letter-spacing:-.04em;line-height:1.04}
h2{font-size:21px;font-weight:800;letter-spacing:-.028em}
b,strong{font-weight:700}
.m,small,dt{color:var(--mut);font-size:15px;font-weight:500}
.wrap{padding-top:max(22px,calc(env(safe-area-inset-top,0px) + 12px))}

/* Karten */
.k{background:var(--card);border:0;border-radius:var(--r);padding:20px;gap:10px}
.card{transition:transform .14s ease}.card:hover{border-color:transparent}.card:active{transform:scale(.985)}
.card>span:first-child b{font-size:20px;font-weight:800;letter-spacing:-.03em;line-height:1.15}
.k.full{background:var(--gbg);border:0}.k.soon{background:var(--obg);border:0}.k.exp{background:var(--rbg);border:0}
.card.old{border:0;opacity:.72}.k.amb,.amb{border:0;background:var(--obg)}
.grid{gap:14px}.stack{gap:14px}
/* Buttons */
.b{border:0;border-radius:999px;background:var(--card);color:var(--pri);font-weight:700;padding:0 22px;min-height:52px;transition:transform .12s ease}

.k .b,.lst2 .b{background:color-mix(in srgb,var(--pri) 10%,var(--card))}
.g,.k .g,.lst2 .g{background:var(--pri);color:var(--onpri)}
.ic{min-width:52px;padding:0;border-radius:50%;display:inline-flex;align-items:center;justify-content:center}
.dng,.k .dng,.lst2 .dng{background:var(--rbg);color:var(--red);border:0}
.tool .g.ic{box-shadow:none}
/* Eingaben */
select,input,textarea{min-height:52px;border:2px solid transparent;border-radius:var(--rs);background:var(--card);padding:0 18px}
.k input,.k select,.k textarea,.lst2 input,.lst2 select,.qrow input{background:var(--fill)}

input:focus,select:focus,textarea:focus{border-color:var(--pri);background:var(--card)}

.sf .x{background:var(--fill)}
select{border-radius:999px;padding:0 18px}

.nav{left:14px;right:14px;bottom:calc(12px + env(safe-area-inset-bottom,0px));max-width:480px;margin:0 auto;padding:6px;gap:4px;border:0;border-radius:36px;background:var(--card);box-shadow:0 0 0 1px color-mix(in srgb,var(--ink) 8%,transparent),0 10px 34px rgba(10,30,18,.16)}

.stt.s-confirmed{color:var(--pri)}.stt.s-confirmed::before{background:var(--ok)}

.stt.s-declined::before{background:var(--red)}
.prow{grid-template-columns:150px minmax(0,1fr) auto}
a.wa,div.wa{border:0;border-radius:var(--rs);background:var(--fill);min-height:52px;color:var(--pri)}

.stack.d{gap:12px}

.d>.k.amb{background:var(--obg);border-radius:var(--r);padding:20px}

 ${s0.reise?`<div class="stack${S.rop&&S.rop[i]?'':' closed'}" style="gap:6px;border-top:1px solid var(--line);padding-top:8px"><button class="rth" data-a=rtg data-i=${i} aria-expanded=${S.rop&&S.rop[i]?'true':'false'}><b>Reise und Off-Days</b><span class=m>${[sh.travelIn&&'Anreise',sh.travelOut&&'Abreise',sh.offDays.length&&sh.offDays.length+' Off-Day'+(sh.offDays.length>1?'s':'')].filter(Boolean).join(' · ')||'nicht gesetzt'} ${S.rop&&S.rop[i]?'▴':'▾'}</span></button><div class="chips cs"><label class="chip${sh.travelIn?' on':''}"><input type=checkbox data-si=${i} data-sb=travelIn${sh.travelIn?' checked':''}>Anreisetag (erster Tag)</label><label class="chip${sh.travelOut?' on':''}"><input type=checkbox data-si=${i} data-sb=travelOut${sh.travelOut?' checked':''}>Abreisetag (letzter Tag)</label></div><label class=lb><small>Reisetage werden berechnet mit</small><select data-si=${i} data-sf=travelRate>${rt(sh.travelRate)}</select></label><small>Off-Days im Zeitraum</small><div class="chips cs">${dk.map(k=>`<label class="chip${sh.offDays.includes(k)?' on':''}"><input type=checkbox data-si=${i} data-so="${k}"${sh.offDays.includes(k)?' checked':''}>${fd(k)}</label>`).join('')||'<small>Erst Von und Bis wählen.</small>'}</div>${all.length>45?'<small>Nur die ersten 45 Tage werden angezeigt.</small>':''}<label class=lb><small>Off-Days werden berechnet mit</small><select data-si=${i} data-sf=offRate>${rt(sh.offRate,1)}</select></label></div>`:''}`,pos:`<label class=lb><small>Benötigte Personen</small><select data-si=${i} data-sf=needed aria-label="Benötigte Personen">${[...new Set([...Array.from({length:10},(_,n)=>n+1),Math.max(1,+sh.needed||1)])].sort((x,y)=>x-y).map(n=>`<option value=${n}${n===Math.max(1,+sh.needed||1)?' selected':''}>${n}</option>`).join('')}</select></label> ${live?`<div class=stack style="gap:6px;border-top:1px solid var(--line);padding-top:8px"><b>Besetzung</b><small>Änderungen an der Besetzung gelten sofort.</small>${Object.entries(live.people).map(([p function kartei(){if(S.fe)return fform();const f=S.fsel&&S.fl.find(x=>x.id===S.fsel);if(f)return fdet(f);return S.fv==='cal'?`<div class=tool><div class=tgs><button class="ib${S.leg?' on':''}" aria-pressed=${!!S.leg} data-a=leg aria-label="Legende ein- oder ausblenden">i</button></div><button class="b g ic" style="margin-left:auto;min-width:52px;font-size:28px;line-height:1" data-a=fnew aria-label="Neuer Freelancer">+</button></div><div id=res>${cal(S.jobs,true)}</div>`:flist()}

function fres(){const t=S.fs.toLowerCase(),s=S.set,ok=f=>ffok(f)&&(!t||fhay(f).includes(t)),srt=(a,b)=>a.name.localeCompare(b.name,'de',{sensitivity:'base'}),card=f=>`<button class="k card${['',' soon',' exp'][lsev(f)]}${f.arch?' arc':''}" data-a=fopen data-id=${f.id}><span><b>${esc(f.name)}</b>${s.satz&&s.satzliste?` <span class=m>· ${eur(f.rate)} / Tag</span>`:''}</span>${f.quals.length?`<span class=m>${f.quals.map(esc).join(', ')}</span>`:''}${s.fuehrer&&f.lic.length?`<span class=m>${licTxt(f)}</span>`:''}${s.scheine&&(f.certs||[]).length?`<span class=m>${f.certs.map(c=>esc(c.name)).join(', ')}</span>`:''}${lbad(f)?`<span><b>${lsev(f)===2?'Nachweis abgelaufen':'Nachweis läuft bald ab'}</b></span>`:''}</button>`,xs=S.fl.filter(f=>!f.arch&&ok(f)).sort(srt),ar=S.fl.filter(f=>f.arch&&ok(f)).sort(srt);
 return `<div class=grid>${xs.map(card).join('')||(S.fl.length?'<div class=m>Keine Freelancer für diese Filter.</div>':'<div class=k><h2>Noch keine Freelancer</h2><div class=m>Tippe auf „+ Neuer Freelancer“ und lege die erste Person an. Qualifikationen legst du vorher unter Einstellungen an.</div></div>')}</div>${ar.length?`<button class=rth style="margin-top:14px" data-a=farc aria-expanded=${S.farc?'true':'false'}><b>Archiv · ${ar.length}</b><span class=m>${S.farc?'▴':'▾'}</span></button>${S.farc?`<div class=grid>${ar.map(card).join('')}</div>`:''}`:''}`}

 <div class=k><h2>Qualifikationen</h2>${f.quals.map(q=>`<div class=stack style="gap:6px"><b>${esc(q)}</b>${im((f.qimg||{})[q],'Nachweis '+q)}</div>`).join('')||'<div class=m>Keine Qualifikation hinterlegt.</div>'}</div>

  h+=`<div class=dp><b>${new Date(S.fcd+'T12:00').toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long'})}</b>`+a.map(({j,s,st})=>{const l1=jl([esc(j.firma),esc(j.ort)]);const e1=evt(s.date===S.fcd?esc(tmz(s.start)):'',s.end===S.fcd?esc(tmz(s.endT)):'','');return `<button class="ev${e1.c}" data-a=open data-id=${j.id}>${e1.h}<span class="bar p-${st}"></span><span class=tx><b>${esc(j.title)}</b>${l1?`<span class=m>${l1}</span>`:''}<span class=m>${jl([esc(s.qual),ST[st]])}</span></span></button>`}).join('')+b.map(x=>`<div class="ev blk"><span class=tm><b>gesperrt</b></span><span class="bar p-blk"></span><span class=tx><b>${esc(x.note||'Gesperrt')}</b><span class=m>${fdl(x.from)}${x.to!==x.from?' – '+fdl(x.to):''}</span></span></div>`).join('')+(a.length||b.length?'':'<div class=m style="padding:10px 2px;border-top:1px solid var(--line)">Frei an diesem Tag.</div>')+'</div>'}
 return h+legend(false,true)+'</div>'}
